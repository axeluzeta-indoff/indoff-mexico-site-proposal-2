deployment:
  tasks:
    - /bin/echo "→ Deploying Indoff México (Astro dist → public_html)"
    - /bin/rsync -a --delete --exclude='/uploads/' --filter='P uploads/' --exclude='/.well-known/' --filter='P .well-known/' /home/indoff7/indoffmexico_front/dist/ /home/indoff7/public_html/
    - /bin/cp -f /home/indoff7/indoffmexico_front/deploy/.htaccess /home/indoff7/public_html/.htaccess
    - /bin/bash -lc '[ -L /home/indoff7/public_html/uploads ] || ln -s ../uploads_mexico /home/indoff7/public_html/uploads'
